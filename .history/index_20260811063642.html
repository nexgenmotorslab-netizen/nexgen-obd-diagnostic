<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXGEN OBD-II Professional Scanner</title>
    <style>
        :root {
            --bg: #0a0e14;
            --card: #161b22;
            --accent: #00d4ff;
            --good: #00ff88;
            --warn: #ffaa00;
            --danger: #ff3b3b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg);
            color: #e6edf3;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
        }

        .header h1 {
            color: var(--accent);
        }

        .status {
            padding: 8px 15px;
            border-radius: 20px;
            background: var(--card);
            font-size: 14px;
        }

        .status.connected {
            border-left: 4px solid var(--good);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }

        .card h3 {
            font-size: 14px;
            color: #7d8590;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .card .value {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent);
        }

        .card .unit {
            font-size: 16px;
            color: #7d8590;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 15px;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
        }

        .btn-warn {
            background: var(--warn);
            color: #000;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        button:hover {
            opacity: 0.8;
            transform: translateY(-2px);
        }

        #faults {
            white-space: pre-wrap;
            font-family: 'Consolas', monospace;
            color: var(--warn);
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }

            /* 2 cards per row on phone */
            .actions {
                flex-direction: column;
            }

            /* buttons stack */
            .header {
                flex-direction: column;
                gap: 10px;
            }

            .card .value {
                font-size: 24px;
            }
        }

        .card.danger {
            border: 2px solid var(--danger);
            animation: pulse 1s infinite;
        }

        .card.warn {
            border: 2px solid var(--warn);
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            /* 1 card per row on phone */
            button {
                width: 100%;
                font-size: 18px;
                padding: 15px;
            }

            /* Big buttons */
            body {
                padding: 10px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="header">
        <div class="logo">NEXGEN<span style="color:white"> OBD</span></div>
        <div id="connStatus" class="status">● Checking Connection...</div>
    </div>

    <div class="actions">

        <button id="connectBtn" style="background:#00ccff;">Connect ELM327</button>
        <div id="btStatus" style="color:#00ccff; margin:10px;">Bluetooth: Not Connected</div>
        <button class="btn-primary" onclick="getData()">⟳ Refresh Live Data</button>
        <button class="btn-warn" onclick="getFaults()">⚠ Scan Faults</button>
        <button class="btn-danger" onclick="resetCar()">🗑 Clear Codes</button>
        <button onclick="savePDF()">Save PDF</button>
        <button onclick="toggleLog()">Start Record</button>
        <button onclick="downloadCSV()">Download CSV</button>
    </div>



    <button class="btn-info" onclick="testEVBattery()">EV Battery Health</button>
    <button class="btn-info" onclick="testEVTemp()">Battery Temp</button>


    <div id="results" style="color:#ffff00; font-size:20px; margin:20px;">Results: Ready</div> <-- Right above this line
        </div>

        <div class="grid">
            <div class="grid">
                <div class="card" id="card-rpm">
                    <h3>Engine RPM</h3>
                    <div><span id="rpm" class="value">---</span><span class="unit"> RPM</span></div>
                </div>

                <div class="card" id="card-speed">
                    <h3>Vehicle Speed</h3>
                    <div><span id="speed" class="value">---</span><span class="unit"> km/h</span></div>
                </div>

                <div class="card" id="card-coolant">
                    <h3>Coolant Temp</h3>
                    <div><span id="coolant" class="value">---</span><span class="unit"> °C</span></div>
                </div>

                <div class="card" id="card-load">
                    <h3>Engine Load</h3>
                    <div><span id="load" class="value">---</span><span class="unit"> %</span></div>
                </div>

                <div class="card" id="card-throttle">
                    <h3>Throttle Pos</h3>
                    <div><span id="throttle" class="value">---</span><span class="unit"> %</span></div>
                </div>
            </div>

        </div>

        <div class="card">
            <h3>Diagnostic Trouble Codes</h3>
            <div id="faults">Click "Scan Faults" to check</div>
        </div>

        <div class="grid">
            <canvas id="rpmChart" height="200"></canvas>
            <div class="card"><canvas id="rpmChart"></canvas></div>
            <div class="card"><canvas id="speedChart"></canvas></div>
        </div>

        <script>
            const API_URL = "https://nexgen-obd-diagnostic-production.up.railway.app"
            let lastFaultCount = 0; // to detect new faults

            async function getData() {
                let res = await fetch('$API/all');
                let data = await res.json();

                // Update values
                document.getElementById('rpm').innerText = data.rpm ?? 'N/A';
                document.getElementById('speed').innerText = data.speed_kmh ?? 'N/A';
                document.getElementById('coolant').innerText = data.coolant_temp_c ?? 'N/A';
                document.getElementById('load').innerText = data.engine_load_percent ?? 'N/A';
                document.getElementById('throttle').innerText = data.throttle_percent ?? 'N/A';

                // SMART ALERTS LOGIC
                setAlert('card-rpm', data.rpm > 6000, 'danger'); // Redline
                setAlert('card-coolant', data.coolant_temp_c > 105, 'danger'); // Overheating
                setAlert('card-coolant', data.coolant_temp_c > 95 && data.coolant_temp_c <= 105, 'warn'); // Hot
                setAlert('card-load', data.engine_load_percent > 90, 'warn'); // Heavy load

                document.getElementById('connStatus').innerText = '● Connected to ECU';
                document.getElementById('connStatus').className = 'status connected';
            }

            function setAlert(cardId, condition, type) {
                const card = document.getElementById(cardId);
                card.classList.remove('danger', 'warn');
                if (condition) card.classList.add(type);
            }

            // NEW: BEEP ON NEW FAULT
            async function getFaults() {
                document.getElementById('faults').innerText = 'Scanning...';
                let res = await fetch('/faults');
                let data = await res.json();
                document.getElementById('faults').innerText = JSON.stringify(data, null, 2);

                let faultCount = data.faults?.length ?? 0;
                if (faultCount > lastFaultCount && faultCount > 0) {
                    beep(); // BEEP if new fault found
                }
                lastFaultCount = faultCount;
            }

            function beep() {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'square'; osc.frequency.setValueAtTime(1000, ctx.currentTime);
                osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.2);
            }

            async function resetCar() {
                if (confirm("This will clear all DTCs and reset MIL. Continue?")) {
                    let res = await fetch('/reset', { method: 'POST' });
                    let data = await res.json();
                    alert(data.message);
                    getFaults();
                }
            }

            // Auto refresh every 2 seconds
            setInterval(getData, 2000);
            window.onload = getData;

            const rpmCtx = document.getElementById('rpmChart');
            const speedCtx = document.getElementById('speedChart');

            const rpmChart = new Chart(rpmCtx, {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'RPM', data: [], borderColor: '#00d4ff', tension: 0.4 }] },
                options: { responsive: true, animation: false, scales: { y: { beginAtZero: true } } }
            });

            const speedChart = new Chart(speedCtx, {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'Speed km/h', data: [], borderColor: '#00ff88', tension: 0.4 }] },
                options: { responsive: true, animation: false, scales: { y: { beginAtZero: true } } }
            });

            let time = 0;
            function updateCharts(rpm, speed) {
                time++;
                rpmChart.data.labels.push(time);
                rpmChart.data.datasets[0].data.push(rpm);
                speedChart.data.labels.push(time);
                speedChart.data.datasets[0].data.push(speed);

                if (rpmChart.data.labels.length > 20) { // keep last 20 points
                    rpmChart.data.labels.shift();
                    rpmChart.data.datasets[0].data.shift();
                    speedChart.data.labels.shift();
                    speedChart.data.datasets[0].data.shift();
                }
                rpmChart.update();
                speedChart.update();
            }

            // UPDATE getData() FUNCTION TO CALL IT
            async function getData() {
                let res = await fetch('/all');
                let data = await res.json();
                document.getElementById('rpm').innerText = data.rpm ?? 'N/A';
                document.getElementById('speed').innerText = data.speed_kmh ?? 'N/A';
                //... keep the rest
                updateCharts(data.rpm ?? 0, data.speed_kmh ?? 0); // ADD THIS LINE
            }

            function savePDF() {
                let win = window.open('', '', 'height=700,width=800');
                let content = `
    <h1>NEXGEN OBD REPORT</h1>
    <p><b>Date:</b> ${new Date().toLocaleString()}</p>
    <p><b>Shop:</b> NexGen MotorsLab</p>
    <hr>
    <h3>Live Data</h3>
    <p>RPM: ${document.getElementById('rpm').innerText}</p>
    <p>Speed: ${document.getElementById('speed').innerText} km/h</p>
    <p>Coolant: ${document.getElementById('coolant').innerText} °C</p>
    <p>Load: ${document.getElementById('load').innerText} %</p>
    <p>Throttle: ${document.getElementById('throttle').innerText} %</p>
    <hr>
    <h3>Fault Codes</h3>
    <pre>${document.getElementById('faults').innerText}</pre>
    `;
                win.document.write(content);
                win.document.close();
                win.print(); // This opens the "Save as PDF" dialog
            }

            let logData = [];
            let logging = false;
            let logInterval;

            function toggleLog() {
                logging = !logging;
                event.target.innerText = logging ? 'Stop Record' : 'Start Record';

                if (logging) {
                    logData = [['Time', 'RPM', 'Speed', 'Coolant', 'Load', 'Throttle']]; // headers
                    logInterval = setInterval(() => {
                        let row = [
                            new Date().toLocaleTimeString(),
                            document.getElementById('rpm').innerText,
                            document.getElementById('speed').innerText,
                            document.getElementById('coolant').innerText,
                            document.getElementById('load').innerText,
                            document.getElementById('throttle').innerText
                        ];
                        logData.push(row);
                    }, 500); // log every 0.5 seconds
                } else {
                    clearInterval(logInterval);
                }
            }

            function downloadCSV() {
                let csv = logData.map(row => row.join(",")).join("\n");
                let blob = new Blob([csv], { type: 'text/csv' });
                let url = window.URL.createObjectURL(blob);
                let a = document.createElement('a');
                a.setAttribute('href', url);
                a.setAttribute('download', 'obd_log_' + Date.now() + '.csv');
                a.click();
            }

            // ===== BLUETOOTH FOR ELM327 =====
            let bleDevice, bleServer, bleChar;

            document.getElementById('connectBtn').onclick = async () => {
                try {
                    document.getElementById('btStatus').innerText = "Bluetooth: Searching...";

                    bleDevice = await navigator.bluetooth.requestDevice({
                        filters: [{ namePrefix: "OBD" }, { namePrefix: "ELM" }, { namePrefix: "VLink" }],
                        optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
                    });

                    bleServer = await bleDevice.gatt.connect();
                    let service = await bleServer.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                    bleChar = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');

                    document.getElementById('btStatus').innerText = "Bluetooth: Connected to " + bleDevice.name;
                    document.getElementById('connectBtn').innerText = "Connected";
                    document.getElementById('connectBtn').disabled = true;

                    // Init ELM327
                    sendELM("ATZ\r"); await sleep(1000);
                    sendELM("ATE0\r"); await sleep(200);
                    sendELM("010C\r"); // Start RPM loop
                    sendELM("0105\r"); // Start Coolant loop
                    readELM();

                } catch (err) {
                    document.getElementById('btStatus').innerText = "Bluetooth Error: " + err;
                }
            }

            // Send command to ELM
            async function sendELM(cmd) {
                if (!bleChar) return;
                await bleChar.writeValue(new TextEncoder().encode(cmd));
            }

            // Read data from ELM and update your gauges
            function readELM() {
                bleChar.startNotifications();
                bleChar.addEventListener('characteristicvaluechanged', e => {
                    let data = new TextDecoder().decode(e.target.value);
                    console.log("ELM:", data);

                    // Update RPM gauge
                    if (data.includes("41 0C")) {
                        let d = data.split(' ');
                        let rpm = ((parseInt(d[2], 16) * 256) + parseInt(d[3], 16)) / 4;
                        document.getElementById('rpm').innerText = Math.round(rpm); // connects to your existing RPM gauge
                    }
                    // Update Coolant gauge
                    if (data.includes("41 05")) {
                        let d = data.split(' ');
                        let temp = parseInt(d[2], 16) - 40;
                        document.getElementById('coolant').innerText = temp; // connects to your existing Coolant gauge
                    }
                    // Update Faults
                    if (data.includes("43")) {
                        document.getElementById('faults').innerText = "Faults Found: " + data;
                        new Audio('https://www.soundjay.com/button/beep-07.wav').play(); // beep
                    }
                });
            }

            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
            // ===== END BLUETOOTH =====

        </script>
</body>

</html>
