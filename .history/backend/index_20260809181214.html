<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXGEN OBD-II Professional Scanner</title>
    <style>
        :root {
            --bg: #0a0e14;
            --card: #161b22;
            --accent: #00d4ff;
            --good: #00ff88;
            --warn: #ffaa00;
            --danger: #ff3b3b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: #e6edf3; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .header h1 { color: var(--accent); }
        .status { padding: 8px 15px; border-radius: 20px; background: var(--card); font-size: 14px; }
        .status.connected { border-left: 4px solid var(--good); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #30363d; }
        .card h3 { font-size: 14px; color: #7d8590; margin-bottom: 10px; text-transform: uppercase; }
        .card .value { font-size: 32px; font-weight: bold; color: var(--accent); }
        .card .unit { font-size: 16px; color: #7d8590; }
        .actions { display: flex; gap: 10px; margin-bottom: 20px; }
        button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-warn { background: var(--warn); color: #000; }
        .btn-danger { background: var(--danger); color: white; }
        button:hover { opacity: 0.8; transform: translateY(-2px); }
        #faults { white-space: pre-wrap; font-family: 'Consolas', monospace; color: var(--warn); }
        .logo { font-size: 24px; font-weight: 900; letter-spacing: 2px; }

        @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr 1fr; } /* 2 cards per row on phone */
    .actions { flex-direction: column; } /* buttons stack */
    .header { flex-direction: column; gap: 10px; }
    .card .value { font-size: 24px; }
}

.card.danger { border: 2px solid var(--danger); animation: pulse 1s infinite; }
.card.warn { border: 2px solid var(--warn); }
@keyframes pulse { 0% {opacity: 1;} 50% {opacity: 0.5;} 100% {opacity: 1;} }
        
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">NEXGEN<span style="color:white"> OBD</span></div>
        <div id="connStatus" class="status">● Checking Connection...</div>
    </div>

    <div class="actions">
        <button class="btn-primary" onclick="getData()">⟳ Refresh Live Data</button>
        <button class="btn-warn" onclick="getFaults()">⚠ Scan Faults</button>
        <button class="btn-danger" onclick="resetCar()">🗑 Clear Codes</button>
    </div>

    <div class="grid">
       
    </div>

    <div class="card">
        <h3>Diagnostic Trouble Codes</h3>
        <div id="faults">Click "Scan Faults" to check</div>
    </div>

    <div class="grid">
    <div class="card"><canvas id="rpmChart"></canvas></div>
    <div class="card"><canvas id="speedChart"></canvas></div>
</div>

<script>
async function getData() {
    let res = await fetch('/all');
    let data = await res.json();
    document.getElementById('rpm').innerText = data.rpm ?? 'N/A';
    document.getElementById('speed').innerText = data.speed_kmh ?? 'N/A';
    document.getElementById('coolant').innerText = data.coolant_temp_c ?? 'N/A';
    document.getElementById('load').innerText = data.engine_load_percent ?? 'N/A';
    document.getElementById('throttle').innerText = data.throttle_percent ?? 'N/A';
    document.getElementById('connStatus').innerText = '● Connected to ECU';
    document.getElementById('connStatus').className = 'status connected';
}

async function getFaults() {
    document.getElementById('faults').innerText = 'Scanning...';
    let res = await fetch('/faults');
    let data = await res.json();
    document.getElementById('faults').innerText = JSON.stringify(data, null, 2);
}

async function resetCar() {
    if(confirm("This will clear all DTCs and reset MIL. Continue?")) {
        let res = await fetch('/reset', {method: 'POST'});
        let data = await res.json();
        alert(data.message);
        getFaults();
    }
}

// Auto refresh every 2 seconds
setInterval(getData, 2000);
window.onload = getData;

const rpmCtx = document.getElementById('rpmChart');
const speedCtx = document.getElementById('speedChart');

const rpmChart = new Chart(rpmCtx, {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'RPM', data: [], borderColor: '#00d4ff', tension: 0.4 }] },
    options: { responsive: true, animation: false, scales: { y: { beginAtZero: true } } }
});

const speedChart = new Chart(speedCtx, {
    type: 'line', 
    data: { labels: [], datasets: [{ label: 'Speed km/h', data: [], borderColor: '#00ff88', tension: 0.4 }] },
    options: { responsive: true, animation: false, scales: { y: { beginAtZero: true } } }
});

let time = 0;
function updateCharts(rpm, speed) {
    time++;
    rpmChart.data.labels.push(time);
    rpmChart.data.datasets[0].data.push(rpm);
    speedChart.data.labels.push(time);
    speedChart.data.datasets[0].data.push(speed);
    
    if(rpmChart.data.labels.length > 20) { // keep last 20 points
        rpmChart.data.labels.shift();
        rpmChart.data.datasets[0].data.shift();
        speedChart.data.labels.shift();
        speedChart.data.datasets[0].data.shift();
    }
    rpmChart.update();
    speedChart.update();
}

// UPDATE getData() FUNCTION TO CALL IT
async function getData() {
    let res = await fetch('/all');
    let data = await res.json();
    document.getElementById('rpm').innerText = data.rpm?? 'N/A';
    document.getElementById('speed').innerText = data.speed_kmh?? 'N/A';
    //... keep the rest
    updateCharts(data.rpm?? 0, data.speed_kmh?? 0); // ADD THIS LINE
}
</script>
</body>
</html>
